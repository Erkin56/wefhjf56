<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我在这儿买光盘</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap&text=我在这儿买光盘第十课">
<style>
/* Layout: a market street. Sticky wallet bar, a red shop sign as the hero, three rows of price-tag stalls; every game opens as one counter, max 760px wide. */
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --surface-2:#F5F8F3; --ink:#17201A; --muted:#56635A; --line:#D2DBD1;
  --accent:#5B39A8; --accent-ink:#FFFFFF; --accent-soft:#ECE6F7;
  --banana:#F7C84A; --banana-ink:#2B2206; --banana-soft:#F9E3A0;
  --apple:#C92A3E; --apple-ink:#FFFFFF;
  --sign:#A51D30; --sign-ink:#FFD45E; --sign-sub:#F8D3D8;
  --ok:#1E7D48; --ok-soft:#DCF1E3; --bad:#B8283A; --bad-soft:#F8DFE2;
  --cd-1:#CDD6E4; --cd-2:#F1D5E6; --cd-3:#D5EFE2; --cd-4:#F5EAC6; --cd-5:#D8DBF4;
  --shadow:0 1px 0 rgb(23 32 26 / .05), 0 12px 24px -18px rgb(23 32 26 / .45);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-han:"Noto Serif SC","Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  --f-pin:"Noto Sans","Golos Text",system-ui,sans-serif;
  --f-brush:"Ma Shan Zheng","KaiTi","STKaiti","Noto Serif SC",serif;
  --r-s:8px; --r-m:14px; --r-l:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111613; --surface:#1A201C; --surface-2:#212823; --ink:#E9EEE9; --muted:#9DAAA1; --line:#2E3832;
    --accent:#B39BF0; --accent-ink:#17102B; --accent-soft:#2C2445;
    --banana:#F2C341; --banana-ink:#241C05; --banana-soft:#54461A;
    --apple:#EC5F72; --apple-ink:#1C0A0E;
    --sign:#86172A; --sign-ink:#FFD45E; --sign-sub:#F3C2C9;
    --ok:#5BD08F; --ok-soft:#17392A; --bad:#FF7F8C; --bad-soft:#3F1C23;
    --shadow:0 1px 0 rgb(0 0 0 / .3), 0 14px 28px -18px rgb(0 0 0 / .8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1A201C; --surface-2:#212823; --ink:#E9EEE9; --muted:#9DAAA1; --line:#2E3832;
  --accent:#B39BF0; --accent-ink:#17102B; --accent-soft:#2C2445;
  --banana:#F2C341; --banana-ink:#241C05; --banana-soft:#54461A;
  --apple:#EC5F72; --apple-ink:#1C0A0E;
  --sign:#86172A; --sign-ink:#FFD45E; --sign-sub:#F3C2C9;
  --ok:#5BD08F; --ok-soft:#17392A; --bad:#FF7F8C; --bad-soft:#3F1C23;
  --shadow:0 1px 0 rgb(0 0 0 / .3), 0 14px 28px -18px rgb(0 0 0 / .8);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.han{font-family:var(--f-han);font-weight:500}
.pin{font-family:var(--f-pin)}
.muted{color:var(--muted)}
.center{text-align:center;justify-content:center}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:6px 0;cursor:pointer}
.brand .brush{font-family:var(--f-brush);font-size:1.7rem;line-height:1;color:var(--apple)}
.brand span:last-child{font-family:var(--f-display);font-size:.8rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

.tag{position:relative;display:inline-flex;align-items:center;gap:.5em;background:var(--banana);color:var(--banana-ink);border-radius:6px 14px 14px 6px;padding:.3rem .85rem .3rem 1.45rem;border:0;line-height:1.2}
.tag::before{content:"";position:absolute;left:.55rem;top:50%;width:.42rem;height:.42rem;margin-top:-.21rem;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1.5px rgb(0 0 0 / .28)}
.wallet{cursor:pointer;flex-direction:column;align-items:flex-start;gap:0;padding-block:.35rem;min-width:7.5rem}
.wallet .wy{font-family:var(--f-display);font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums}
.wallet .wz{font-family:var(--f-han);font-size:.78rem;opacity:.85;max-width:11rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wallet.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:none}35%{transform:scale(1.08) rotate(-2deg)}100%{transform:none}}
.pop{position:absolute;right:6px;top:100%;margin-top:6px;font:600 .85rem var(--f-body);background:var(--ok);color:var(--surface);padding:.15rem .5rem;border-radius:999px;white-space:nowrap;animation:rise 1s ease forwards;pointer-events:none}
@keyframes rise{0%{opacity:0;transform:translateY(-6px)}20%{opacity:1}100%{opacity:0;transform:translateY(12px)}}

/* hero */
main{padding-block:24px 64px}
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:32px}
.sign{position:relative;background:var(--sign);color:var(--sign-ink);border-radius:var(--r-m);padding:28px 28px 24px;box-shadow:var(--shadow);outline:2px solid var(--sign-ink);outline-offset:-10px;overflow:hidden;display:flex;flex-direction:column}
.sign .eyebrow{margin:0 0 6px;font:500 .78rem var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--sign-sub)}
.sign h1{margin:0;font-family:var(--f-brush);font-weight:400;font-size:clamp(2.6rem,9.5vw,4.6rem);line-height:1.1;letter-spacing:.04em;text-wrap:balance}
.sign .spy{margin:4px 0 0;font-family:var(--f-pin);font-size:1.15rem;color:var(--sign-sub)}
.sign .sru{margin:auto 0 0;padding-top:14px;max-width:46ch;color:var(--sign-sub);font-size:.98rem}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.fact b{font-family:var(--f-han);font-size:1.35rem;font-weight:700}
.fact span{color:var(--muted);font-size:.9rem}
.fact.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fact.wide .num{font-family:var(--f-display);font-weight:700;font-size:1.05rem;color:var(--ink)}
.start-hint{grid-column:1/-1;margin:0;color:var(--muted);font-size:.95rem}

.sec{margin-top:36px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.sec-h .han{font-size:1.9rem;font-weight:700;line-height:1}
.sec-h h2{margin:0;font:700 1.05rem var(--f-display);letter-spacing:.02em}
.sec-h p{margin:0;color:var(--muted);font-size:.92rem;flex-basis:100%}
.stalls{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.stall{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;cursor:pointer;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;min-width:0}
.stall:hover{transform:translateY(-2px);border-color:var(--ink);box-shadow:var(--shadow)}
.stall .stag{font-family:var(--f-han);font-size:1.15rem;font-weight:700}
.stall .sname{font-weight:700;font-size:1.08rem;line-height:1.25}
.stall .sd{color:var(--muted);font-size:.92rem;line-height:1.4}
.stall .stars{margin-top:auto;font-size:1.05rem;letter-spacing:.12em}
.star-on{color:var(--banana)}
.star-off{color:var(--line)}
.t-w{background:var(--banana);color:var(--banana-ink)}
.t-t{background:var(--accent);color:var(--accent-ink)}
.t-p{background:var(--apple);color:var(--apple-ink)}

.shopband{margin-top:36px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--muted);border-radius:var(--r-m);padding:16px 18px}
.shopband p{margin:0;max-width:60ch}
.shopband .shelf-mini{font-size:1.5rem;letter-spacing:.1em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.6rem 1.15rem;font-weight:600;cursor:pointer;min-height:44px;transition:border-color .15s ease,background .15s ease}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;padding-inline:.4rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* game shell */
.game{max-width:760px;margin:0 auto}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gmeta{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px}
.gmeta h2{margin:0;font:700 1.15rem var(--f-display);letter-spacing:.01em}
.gmeta .tag{font-family:var(--f-han);font-weight:700;flex:none;white-space:nowrap}
.gstat{display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.streak{background:var(--banana);color:var(--banana-ink);border-radius:999px;padding:.1rem .6rem;font-size:.85rem}
.bar{height:6px;background:var(--line);border-radius:999px;margin:12px 0 20px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .35s ease}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:22px;text-align:center;margin-bottom:14px;min-width:0}
.ask{margin:0 0 6px;color:var(--muted);font-size:.85rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.han-xl{font-family:var(--f-han);font-weight:700;font-size:clamp(3rem,13vw,5.2rem);line-height:1.15}
.pin-xl{font-family:var(--f-pin);font-size:clamp(1.8rem,7vw,2.6rem);font-weight:500}
.ru-xl{font-size:clamp(1.3rem,5vw,1.8rem);font-weight:600;line-height:1.3}
.sub{margin:6px 0 0;color:var(--muted)}
.zhq{font-family:var(--f-han);font-size:clamp(1.3rem,4.8vw,1.75rem);line-height:1.6;margin:4px 0 0;font-weight:500}
.zhq u,.blank{display:inline-block;min-width:2.4em;border-bottom:3px solid var(--accent);text-decoration:none;margin:0 .15em;line-height:1.1}
.ctx{margin:0 0 8px;color:var(--muted);font-family:var(--f-han);font-size:1.05rem}
.tr{margin-top:10px;font-size:.95rem;color:var(--muted)}
.tr summary{cursor:pointer;display:inline-block;font-weight:600;color:var(--accent)}
.tr p{margin:6px 0 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-m);padding:14px 16px;min-height:60px;cursor:pointer;transition:border-color .12s ease,background .12s ease,transform .12s ease;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:active:not(:disabled){transform:scale(.985)}
.opt:disabled{cursor:default}
.opt .kbd{flex:none;width:1.6rem;height:1.6rem;border-radius:6px;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--line)}
.opt .otx{min-width:0;overflow-wrap:anywhere;font-size:1.05rem;display:flex;flex-direction:column;gap:2px}
.opt .otx .han{font-size:1.4rem;line-height:1.35}
.opt .otx .ru{font-size:.88rem;color:var(--muted)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.ok .kbd{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);animation:shake .35s}
.opt.bad .kbd{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.pin-opt{font-family:var(--f-pin);font-size:1.3rem}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:14px;border-radius:var(--r-m);padding:14px 16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--surface)}
.fb.good{border-color:var(--ok)}
.fb.nope{border-color:var(--bad)}
.fb .verdict{margin:0;font-weight:700}
.fb.good .verdict{color:var(--ok)}
.fb.nope .verdict{color:var(--bad)}
.fb p{margin:0}
.wl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.wl .han{font-size:1.4rem}
.wl .pin{color:var(--accent);font-weight:500}
.syl{display:inline-flex;flex-direction:column;align-items:center;padding:4px 10px;background:var(--surface-2);border-radius:var(--r-s);border:1px solid var(--line)}
.syl .tn{font-size:.75rem;color:var(--muted)}
.quote{font-size:.95rem}
.quote .han{font-size:1.1rem}
mark{background:var(--banana-soft);color:inherit;border-radius:4px;padding:0 .15em}

/* result */
.result{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.rstars{font-size:2.6rem;letter-spacing:.15em;line-height:1}
.result h3{margin:0;font:700 1.4rem var(--f-display)}
.result h3 .han{font-family:var(--f-han)}
.result p{margin:0}
.rscore{font-family:var(--f-display);font-size:1.1rem;font-variant-numeric:tabular-nums}

/* segmented control */
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.35rem .85rem;font-size:.9rem;font-weight:600;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* flashcards */
.flash{display:block;width:100%;min-height:290px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-l);padding:24px;cursor:pointer;text-align:center;box-shadow:var(--shadow);margin-bottom:14px;position:relative}
.flash .ff{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:240px}
.flash .back{display:none}
.flash.flipped .front{display:none}
.flash.flipped .back{display:flex;animation:flip .35s ease}
@keyframes flip{from{transform:rotateY(70deg);opacity:.2}to{transform:none;opacity:1}}
.flash .hint{color:var(--muted);font-size:.85rem}
.flash .han-l{font-family:var(--f-han);font-size:2.6rem;font-weight:700;line-height:1.2}
.flash .pin-l{font-family:var(--f-pin);font-size:1.4rem;color:var(--accent)}
.flash .pos{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.flash .ru-l{font-size:1.3rem;font-weight:600;max-width:30ch}
.flash .ex{font-family:var(--f-han);font-size:1.1rem;color:var(--muted)}
.flash .badge{position:absolute;top:12px;right:12px;font-size:.75rem;font-weight:700;border-radius:999px;padding:.1rem .55rem;background:var(--ok-soft);color:var(--ok)}

/* memory */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mcard{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;padding:8px;overflow:hidden;display:grid;place-items:center}
.mcard .disc{position:absolute;inset:0;margin:auto;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--surface-2) 0 13%,var(--line) 13% 17%,transparent 17%),conic-gradient(from 30deg,var(--cd-1),var(--cd-2),var(--cd-3),var(--cd-4),var(--cd-5),var(--cd-1));box-shadow:inset 0 0 0 1px rgb(0 0 0 / .08);transition:transform .3s ease}
.mcard:hover .disc{transform:rotate(40deg)}
.mface{display:none;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.9rem;line-height:1.25;overflow-wrap:anywhere;position:relative}
.mface .han{font-size:clamp(1.3rem,5.4vw,1.9rem);line-height:1.2}
.mface .pin{font-size:.8rem;color:var(--accent);visibility:hidden}
.mcard.open{background:var(--surface);border-color:var(--accent)}
.mcard.open .disc{display:none}
.mcard.open .mface{display:flex;animation:flip .3s ease}
.mcard.done{background:var(--ok-soft);border-color:var(--ok);cursor:default}
.mcard.done .pin{visibility:visible}
.mcard.miss{border-color:var(--bad);animation:shake .35s}

/* reading */
.rtools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:12px}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.92rem;cursor:pointer;min-height:36px}
.switch input{width:1.1rem;height:1.1rem;accent-color:var(--accent)}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:8px 18px}
.line{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.spk{display:flex;flex-direction:column;padding-top:.7rem}
.spk .han{font-size:1.05rem;font-weight:700}
.spk span:last-child{font-size:.78rem;color:var(--muted)}
.tx{margin:0;font-family:var(--f-han);font-size:1.5rem;line-height:2.5;overflow-wrap:anywhere}
.nopy .tx{line-height:1.8}
ruby{ruby-position:over}
rt{font-family:var(--f-pin);font-size:.5em;color:var(--muted);font-weight:400;letter-spacing:0}
.nopy rt{display:none}
.tok{cursor:pointer;border-radius:5px;padding:0 1px;transition:background .12s ease}
.tok:hover{background:var(--accent-soft)}
.tok.nw{background-image:linear-gradient(var(--banana),var(--banana));background-size:100% 3px;background-repeat:no-repeat;background-position:0 100%}
.tok.sel{background-color:var(--accent-soft);outline:2px solid var(--accent)}
.lru{margin:2px 0 0;color:var(--muted);font-size:.98rem}
.nori .lru{display:none}
.line.masked .lc{filter:blur(7px);cursor:pointer;user-select:none}
.line.masked .lc *{pointer-events:none}
.line.masked .spk::after{content:"нажми, чтобы проверить";font-size:.72rem;color:var(--accent);margin-top:4px}
.gloss{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;margin-top:12px;background:var(--surface);color:var(--ink);border:2px solid var(--accent);border-radius:var(--r-m);padding:12px 16px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline;box-shadow:var(--shadow);min-height:52px}
.gloss .han{font-size:1.5rem}
.gloss .pin{color:var(--accent);font-weight:500}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px}
.note h4{margin:0 0 6px;font-family:var(--f-han);font-size:1.15rem;font-weight:700}
.note p{margin:0;font-size:.94rem}
.subh{font:700 1rem var(--f-display);margin:28px 0 4px}

/* sentence builder */
.answer{min-height:70px;border:2px dashed var(--line);border-radius:var(--r-m);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;background:var(--surface)}
.answer:empty::before{content:"Нажимай на слова ниже по порядку";color:var(--muted);font-size:.92rem;padding-left:4px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;min-height:56px}
.tile{font-family:var(--f-han);font-size:1.35rem;font-weight:500;background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:10px;padding:.35rem .8rem;cursor:pointer;min-height:48px}
.tile:hover{border-color:var(--accent)}
.tile.used{visibility:hidden}
.answer .tile{background:var(--accent-soft);border-color:var(--accent)}
.answer.ok{border-color:var(--ok);border-style:solid;background:var(--ok-soft)}
.answer.bad{border-color:var(--bad);border-style:solid;background:var(--bad-soft)}
.ru-q{margin:0;font-size:1.25rem;font-weight:600}

/* market */
.stall-scene{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;text-align:left}
.crate{position:relative;width:132px;padding:14px 10px 12px;border-radius:var(--r-m);background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
.crate .fruit{font-size:3.2rem;line-height:1.1}
.crate .fname{font-size:1.05rem}
.ptag{margin-top:6px;transform:rotate(-4deg)}
.ptag b{font-family:var(--f-display);font-size:1rem}
.ptag small{font-family:var(--f-han);font-size:.8rem}
.bubbles{display:flex;flex-direction:column;gap:8px;min-width:0}
.bub{margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:1.15rem;display:flex;flex-direction:column;align-self:flex-start;max-width:100%}
.bub b{font-size:.78rem;color:var(--muted);font-family:var(--f-han)}
.bub.me{align-self:flex-end;border-radius:14px 4px 14px 14px;background:var(--accent-soft);border-color:transparent}
.mq{margin:14px 0 0;font-weight:600}

/* talk */
.chat{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;min-height:200px;margin-bottom:14px}
.scene{margin:6px 0;text-align:center;font-size:.85rem;color:var(--muted);font-weight:600}
.msg{max-width:min(85%,520px);padding:10px 14px;border-radius:4px 16px 16px 16px;background:var(--surface-2);border:1px solid var(--line);align-self:flex-start;animation:msgin .3s ease}
.msg.me{align-self:flex-end;border-radius:16px 4px 16px 16px;background:var(--accent-soft);border-color:transparent}
.msg .who{display:block;font-size:.78rem;color:var(--muted)}
.msg p{margin:0}
.msg p.han{font-size:1.25rem;line-height:1.5}
.msg .ru,.replies .ru{color:var(--muted);font-size:.9rem}
.nru .ru{display:none!important}
@keyframes msgin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.replies{display:grid;gap:10px}

/* shop */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:12px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.item .e{font-size:2.6rem;line-height:1.1}
.item .zh{font-family:var(--f-han);font-size:1.2rem;font-weight:700}
.item .ru{color:var(--muted);font-size:.9rem}
.item .tag{margin:4px 0 8px}
.item .tag b{font-family:var(--f-display);font-size:.9rem}
.item .tag small{font-family:var(--f-han)}
.shelf{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
.shelf span{font-size:1.8rem}
.shelf small{font-size:.85rem;color:var(--muted);margin-right:6px}
.blitz-start{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:32px 20px;display:flex;flex-direction:column;gap:12px;align-items:center}
.blitz-start .big{font:700 2rem var(--f-display);margin:0}
.blitz-start p{margin:0;max-width:44ch}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.92rem;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .line{grid-template-columns:1fr;gap:2px}
  .spk{flex-direction:row;gap:8px;align-items:baseline;padding-top:0}
  .line.masked .spk::after{margin-top:0}
}
@media (max-width:520px){
  .opts{grid-template-columns:1fr}
  .opts.hanopts{grid-template-columns:1fr 1fr}
  .mgrid{grid-template-columns:repeat(3,1fr);gap:8px}
  .mcard{aspect-ratio:1}
  .mface{font-size:.82rem}
  .sign{padding:24px 20px 20px}
  .stall-scene{grid-template-columns:1fr;justify-items:center}
  .crate{width:100%;flex-direction:row;justify-content:center;gap:12px}
  .ptag{margin-top:0}
  .tx{font-size:1.35rem}
  .qcard{padding:18px 14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

const TONES = {a:'āáǎà', e:'ēéěè', i:'īíǐì', o:'ōóǒò', u:'ūúǔù', 'ü':'ǖǘǚǜ'};
function syl(s){
  const m = /^([a-zü]+?)(r?)([1-5])$/.exec(s.replace('v', 'ü'));
  if(!m) return s;
  const b = m[1], r = m[2], t = +m[3];
  if(t === 5) return b + r;
  let i = b.indexOf('a');
  if(i < 0) i = b.indexOf('e');
  if(i < 0 && b.includes('ou')) i = b.indexOf('o');
  if(i < 0){ for(let k = b.length - 1; k >= 0; k--){ if('iouü'.includes(b[k])){ i = k; break; } } }
  if(i < 0) return b + r;
  return b.slice(0, i) + TONES[b[i]][t - 1] + b.slice(i + 1) + r;
}

const D = '零一二三四五六七八九';
function numZh(n){
  if(n < 10) return D[n];
  if(n < 20) return '十' + (n % 10 ? D[n % 10] : '');
  if(n < 100) return D[Math.floor(n / 10)] + '十' + (n % 10 ? D[n % 10] : '');
  const b = Math.floor(n / 100), r = n % 100, head = (b === 2 ? '两' : D[b]) + '百';
  if(!r) return head;
  if(r < 10) return head + '零' + D[r];
  return head + (r < 20 ? '一' + numZh(r) : numZh(r));
}
const countZh = n => n === 2 ? '两' : numZh(n);
function priceZh(fen){
  const k = Math.floor(fen / 100), m = Math.floor(fen % 100 / 10), f = fen % 10;
  if(k > 999) return String(k) + '块';

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const ctx = c.getContext('2d'), Wd = c.width = innerWidth, Ht = c.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--banana','--apple','--accent','--ok','--cd-1'].map(v => cs.getPropertyValue(v).trim() || '#F7C84A');
  const ps = Array.from({length:140}, () => ({x:Wd / 2 + (Math.random() - .5) * Wd * .4, y:Ht * .4, vx:(Math.random() - .5) * 10, vy:-Math.random() * 11 - 4, r:Math.random() * 7 + 5, c:pick(cols), a:Math.random() * 6, va:(Math.random() - .5) * .3}));
  let f = 0;
  (function tick(){
    f++; ctx.clearRect(0, 0, Wd, Ht);
    for(const p of ps){ p.vy += .32; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }
    if(f < 120) requestAnimationFrame(tick); else c.remove();
  })();
}

/* generic multiple-choice runner: items = [{prompt, options:[{html, ok}], info, hold, cls, keep}] */
function runner(g, items){
  const ui = shell(g);
  let i = 0, score = 0, streak = 0, earned = 0, locked = false, auto = null;
  function show(){
    if(i >= items.length) return result(g, ui, {score, total: items.length, stars: starsFor(score, items.length), earned});
    locked = false;
    const it = items[i];
    ui.prog(i, items.length);
    const order = it.keep ? it.options.map((_, k) => k) : shuffle(it.options.map((_, k) => k));
    ui.body.innerHTML = `<div class="qcard">${it.prompt}</div>
      <div class="opts ${it.cls || ''}" role="group" aria-label="Варианты ответа">${order.map((k, n) => `<button class="opt" data-k="${k}"><span class="kbd">${n + 1}</span><span class="otx">${it.options[k].html}</span></button>`).join('')}</div>
      <div class="fb" id="fb" hidden></div>`;
  }
  function choose(btn){
    if(locked) return; locked = true;
    const it = items[i], ok = !!it.options[+btn.dataset.k].ok;
    $$('.opt', ui.body).forEach(b => { b.disabled = true; if(it.options[+b.dataset.k].ok) b.classList.add('ok'); });
    if(ok){ score++; streak++; earned += 10; earn(10); } else { streak = 0; btn.classList.add('bad'); }
    ui.streak(streak);
    const fb = $('#fb', ui.body);
    fb.hidden = false; fb.className = 'fb ' + (ok ? 'good' : 'nope');
    fb.innerHTML = `<p class="verdict">${ok ? pick(PRAISE) : 'Не совсем. Правильный ответ отмечен зелёным.'}</p>${it.info || ''}<button class="btn primary" id="next">${i + 1 < items.length ? 'Дальше →' : 'Итоги'}</button>`;
    $('#next', fb).focus({preventScroll:true});
    if(ok && !it.hold) auto = later(next, it.info ? 1500 : 800);
  }
  function next(){ clearTimeout(auto); timers.delete(auto); i++; show(); }
  ui.body.addEventListener('click', e => {
    const b = e.target.closest('.opt'); if(b && !b.disabled) return choose(b);
    if(e.target.closest('#next')) next();
  });
  const onKey = e => {
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    const n = +e.key; if(n >= 1 && n <= 9){ const b = $$('.opt', ui.body)[n - 1]; if(b && !b.disabled) choose(b); }
  };
  document.addEventListener('keydown', onKey);
  cleanup = () => document.removeEventListener('keydown', onKey);
  show();
}

const wordLine = w => `<div class="wl"><span class="han">${w.h}</span><span class="pin">${w.pin}</span><span>${esc(w.ru)}</span></div>`;

function vocabItem(w, type){

}
function toneVariants(w){
  const ts = tonesOf(w.p), idx = ts.map((t, i) => t < 5 ? i : -1).filter(i => i >= 0);
  const out = new Set([w.pin]); let guard = 0;
  while(out.size < 4 && guard++ < 300){
    const t2 = [...ts], n = idx.length > 1 && Math.random() < .5 ? 2 : 1;
    for(let c = 0; c < n; c++){ const j = pick(idx); t2[j] = pick([1,2,3,4].filter(x => x !== ts[j])); }
    out.add(withTones(w.p, t2));
  }
  return [...out];
}
function toneBreak(w){
  const chars = [...w.h], ss = w.p.split(' ');
  const lab = s => s.slice(-1) === '5' ? 'лёгкий тон' : s.slice(-1) + '-й тон';
  if(chars.length !== ss.length) return `<div class="wl"><span class="syl"><span class="han">${w.h}</span><span class="pin">${w.pin}</span><span class="tn">${lab(ss[0])}</span></span></div>`;

}

VIEWS.cards = () => {
  const g = gameById('cards'), ui = shell(g);
  let filter = 'all', mode = 'h', deck = [], idx = 0, flipped = false, again = [];
  function build(list){ deck = list || shuffle(W.filter(w => filter === 'all' || w.g === filter)); idx = 0; flipped = false; again = []; draw(); }
  function controls(){
    return `<div class="seg" aria-label="Набор слов">${GROUPS.map(([k, l]) => `<button data-f="${k}" aria-pressed="${filter === k}">${l}</button>`).join('')}</div>
      <div class="seg" aria-label="Сторона карточки"><button data-m="h" aria-pressed="${mode === 'h'}">Иероглиф → перевод</button><button data-m="r" aria-pressed="${mode === 'r'}">Перевод → иероглиф</button></div>`;
  }
  function draw(){
    const knownN = W.filter(w => state.known[w.h]).length;
    if(idx >= deck.length){
      ui.bar(1); ui.count('');
      ui.body.innerHTML = controls() + `<div class="result">
        <div class="rstars">${starStr(Math.min(3, Math.round(knownN / W.length * 3)))}</div>
        <h3><span class="han">好！</span> Колода пройдена</h3>
        <p>Знаю ${knownN} из ${W.length} слов. ${again.length ? `Ещё учу: <span class="han">${again.map(w => w.h).join('、')}</span>` : 'Все слова в этой колоде отмечены.'}</p>
        <div class="row center">${again.length ? '<button class="btn primary" id="rep">Повторить «ещё учу»</button>' : ''}<button class="btn" id="restart">Начать заново</button></div>
      </div>`;
      const rep = $('#rep'); if(rep) rep.onclick = () => build(shuffle(again));
      $('#restart').onclick = () => build();
      return;
    }
    const w = deck[idx];
    ui.prog(idx, deck.length);
    ui.body.innerHTML = controls() + `
      <button class="flash ${flipped ? 'flipped' : ''}" id="flash" aria-label="Перевернуть карточку">
        ${state.known[w.h] ? '<span class="badge">знаю</span>' : ''}
        <span class="ff front">${mode === 'h' ? `<span class="han-xl">${w.h}</span>` : `<span class="ru-xl">${esc(w.ru)}</span>`}<span class="hint">Нажми, чтобы перевернуть</span></span>
        <span class="ff back"><span class="han-l">${w.h}</span><span class="pin-l">${w.pin}</span><span class="pos">${w.pos}</span><span class="ru-l">${esc(w.ru)}</span>${w.ex ? `<span class="ex">${w.ex}</span>` : ''}</span>
      </button>
      <div class="row center"><button class="btn" id="again">Ещё учу</button><button class="btn primary" id="know">Знаю ✓</button></div>
      <p class="muted center" style="margin-top:12px">Знаю ${knownN} из ${W.length}. Клавиши: пробел переворачивает, ← ещё учу, → знаю.</p>`;
  }
  function know(){ const w = deck[idx]; if(!w) return; if(!state.known[w.h]){ state.known[w.h] = true; save(); earn(10); } idx++; flipped = false; draw(); }
  function still(){ const w = deck[idx]; if(!w) return; if(!again.includes(w)) again.push(w); idx++; flipped = false; draw(); }
  ui.body.addEventListener('click', e => {
    const f = e.target.closest('[data-f]'); if(f){ filter = f.dataset.f; return build(); }
    const m = e.target.closest('[data-m]'); if(m){ mode = m.dataset.m; flipped = false; return draw(); }
    if(e.target.closest('#flash')){ flipped = !flipped; $('#flash').classList.toggle('flipped', flipped); return; }
    if(e.target.closest('#know')) return know();
    if(e.target.closest('#again')) return still();
  });
  const onKey = e => {
    if(!$('#flash')) return;
    if(e.key === 'ArrowRight') know();
    else if(e.key === 'ArrowLeft') still();
    else if(e.key === ' ' && !(document.activeElement && document.activeElement.closest('button,input,a,summary'))){ e.preventDefault(); flipped = !flipped; $('#flash').classList.toggle('flipped', flipped); }
  };
  document.addEventListener('keydown', onKey);
  cleanup = () => document.removeEventListener('keydown', onKey);
  build();
};

VIEWS.blitz = () => {
  const g = gameById('blitz'), ui = shell(g);
  ui.count('');
  ui.body.innerHTML = `<div class="blitz-start">
    <p class="big">60 секунд</p>
    <p>Появляется иероглиф, выбери перевод как можно быстрее. Каждый верный ответ: +1毛. Цифры 1-4 на клавиатуре тоже работают.</p>
    <p class="muted">Три звезды: 20 верных ответов.</p>
    <button class="btn primary" id="go">开始！ Старт</button>
  </div>`;
  $('#go').onclick = start;
  $('#go').focus({preventScroll:true});
  function start(){
    let score = 0, wrong = 0, prev = null, busy = false, cur = null;
    const t0 = Date.now(), LEN = 60;
    const iv = setInterval(() => {
      const left = LEN - (Date.now() - t0) / 1000;
      if(left <= 0){ clearInterval(iv); end(); return; }
      ui.bar(left / LEN); ui.count(`0:${String(Math.ceil(left)).padStart(2, '0')} · ${score} ✓`);
    }, 200);
    const onKey = e => { const n = +e.key; if(n >= 1 && n <= 4){ const b = $$('.opt', ui.body)[n - 1]; if(b && !b.disabled) answer(b); } };
    document.addEventListener('keydown', onKey);
    cleanup = () => { clearInterval(iv); document.removeEventListener('keydown', onKey); };
    function q(){
      let w; do { w = pick(W); } while(w === prev); prev = w;
      cur = vocabItem(w, 'h2ru'); busy = false;
      const order = shuffle([0,1,2,3]);
      ui.body.innerHTML = `<div class="qcard">${cur.prompt}</div><div class="opts" role="group" aria-label="Варианты ответа">${order.map((k, n) => `<button class="opt" data-k="${k}"><span class="kbd">${n + 1}</span><span class="otx">${cur.options[k].html}</span></button>`).join('')}</div>`;
    }
    function answer(b){
      if(busy) return; busy = true;
      const ok = cur.options[+b.dataset.k].ok;
      $$('.opt', ui.body).forEach(x => { x.disabled = true; if(cur.options[+x.dataset.k].ok) x.classList.add('ok'); });
      if(ok){ score++; earn(10); later(q, 250); } else { wrong++; b.classList.add('bad'); later(q, 900); }
    }
    ui.body.onclick = e => { const b = e.target.closest('.opt'); if(b && !b.disabled) answer(b); };
    function end(){
      document.removeEventListener('keydown', onKey); clearTimers(); ui.body.onclick = null;
      const stars = score >= 20 ? 3 : score >= 14 ? 2 : score >= 8 ? 1 : 0;
      result(g, ui, {stars, earned: score * 10, line: `Верно: ${score} · ошибок: ${wrong}`});
    }
    q();
  }
};

function parseLine(t){
  return t.split(' ').filter(Boolean).map(tok => { const k = tok.indexOf('/'); return k < 0 ? {h: tok, pu: true} : {h: tok.slice(0, k), p: tok.slice(k + 1).replace(/_/g, ' ')}; });
}

VIEWS.build = () => {
  const g = gameById('build'), ui = shell(g), items = sample(BUILD, 8);
  let i = 0, score = 0, picked = [], tiles = [], checked = false;
  function show(){
    if(i >= items.length) return result(g, ui, {score, total: items.length, stars: starsFor(score, items.length), earned: score * 20});
    const it = items[i]; picked = []; checked = false;
    do { tiles = shuffle(it.w); } while(tiles.join('') === it.w.join(''));
    ui.prog(i, items.length);
    ui.body.innerHTML = `<div class="qcard"><p class="ask">Собери фразу по-китайски</p><p class="ru-q">${it.ru}</p></div>
      <div class="answer" id="ans" aria-label="Твоя фраза"></div>
      <div class="pool" id="pool">${tiles.map((t, k) => `<button class="tile" data-k="${k}">${t}</button>`).join('')}</div>
      <div class="row"><button class="btn" id="clr">Очистить</button><button class="btn primary" id="chk" disabled>Проверить</button></div>
      <div class="fb" id="fb" hidden></div>`;
  }
  function sync(){
    $('#ans').innerHTML = picked.map(k => `<button class="tile" data-a="${k}">${tiles[k]}</button>`).join('');
    $$('#pool .tile').forEach(b => b.classList.toggle('used', picked.includes(+b.dataset.k)));
    $('#chk').disabled = picked.length !== tiles.length;
  }
  function check(){
    checked = true;
    const it = items[i], ans = picked.map(k => tiles[k]).join('');
    const goods = [it.w, ...(it.alt || [])].map(a => a.join(''));
    const ok = goods.includes(ans), full = it.zh || it.w.join('') + it.end;
    if(ok){ score++; earn(20); }
    $('#ans').classList.add(ok ? 'ok' : 'bad');
    $$('.tile', ui.body).forEach(b => b.disabled = true);
    $('#chk').disabled = true; $('#clr').disabled = true;
    const fb = $('#fb'); fb.hidden = false; fb.className = 'fb ' + (ok ? 'good' : 'nope');
    fb.innerHTML = `<p class="verdict">${ok ? pick(PRAISE) + ' +2毛' : 'Порядок другой.'}</p><p>${ok ? 'Фраза из текста:' : 'Правильно:'} <span class="han" style="font-size:1.3rem">${full}</span></p><button class="btn primary" id="nx">${i + 1 < items.length ? 'Дальше →' : 'Итоги'}</button>`;
    $('#nx').focus({preventScroll:true});
  }
  ui.body.addEventListener('click', e => {
    if(checked){ if(e.target.closest('#nx')){ i++; show(); } return; }
    const p = e.target.closest('#pool .tile'); if(p && !p.classList.contains('used')){ picked.push(+p.dataset.k); return sync(); }
    const a = e.target.closest('#ans .tile'); if(a){ picked.splice(picked.indexOf(+a.dataset.a), 1); return sync(); }
    if(e.target.closest('#clr')){ picked = []; return sync(); }
    if(e.target.closest('#chk')) return check();
  });
  show();
};

  $('#tru').onchange = e => { showRu = e.target.checked; box.classList.toggle('nru', !showRu); };
  function bubble(who, zh, ru, me){
    chat.insertAdjacentHTML('beforeend', `<div class="msg ${me ? 'me' : ''}"><span class="who han">${who}</span><p class="han">${zh}</p><p class="ru">${ru}</p></div>`);
    chat.lastElementChild.scrollIntoView({block:'nearest', behavior:'smooth'});
  }
  function scene(){
    const S = TALK[sc];
    chat.insertAdjacentHTML('beforeend', `<p class="scene">Сцена ${sc + 1}: ${S.title}. Ты играешь за <span class="han">${S.you}</span> (${SPK[S.you]})</p>`);
    step();
  }
  function step(){
    const S = TALK[sc];
    if(st >= S.steps.length){ sc++; st = 0; return sc < TALK.length ? later(scene, 400) : finish(); }
    const X = S.steps[st];
    bubble(S.them, X.say, X.ru, false);
    if(X.final) return bonus();
    tries = 0;
    rep.innerHTML = `<p class="muted" style="margin:0">Что ответит <span class="han">${S.you}</span>?</p>` + shuffle([0, 1, 2]).map((k, n) => `<button class="opt" data-k="${k}"><span class="kbd">${n + 1}</span><span class="otx"><span class="han">${X.opts[k][0]}</span><span class="ru">${X.opts[k][1]}</span></span></button>`).join('');
  }
  function bonus(){
    rep.innerHTML = `<p style="margin:0"><b>Последний вопрос.</b> Дин Либо просит <span class="han">两斤</span> по новой цене. Сколько он заплатит?</p>` +
      shuffle([['六块钱', 1], ['六块四毛钱', 0], ['三块钱', 0], ['五块钱', 0]]).map(([t, ok], n) => `<button class="opt" data-b="${ok}"><span class="kbd">${n + 1}</span><span class="otx"><span class="han">${t}</span></span></button>`).join('');
  }
  rep.addEventListener('click', e => {
    const b = e.target.closest('.opt'); if(!b || b.disabled) return;
    if(b.dataset.b !== undefined){
      if(b.dataset.b === '1'){ if(!tries){ first++; earn(10); } answered++; ui.count(`${answered} / ${total}`); ui.bar(answered / total); bubble('丁力波', '好，我要两斤。给您六块钱。', 'Хорошо, мне два цзиня. Вот вам шесть юаней.', true); rep.innerHTML = ''; later(finish, 900); }
      else { tries++; b.classList.add('bad'); b.disabled = true; toast('Посчитай: 3 块 × 2 斤'); }
      return;
    }
    const S = TALK[sc], X = S.steps[st];
    if(+b.dataset.k === 0){
      if(!tries){ first++; earn(10); }
      answered++; ui.count(`${answered} / ${total}`); ui.bar(answered / total);
      bubble(S.you, X.opts[0][0], X.opts[0][1], true); rep.innerHTML = ''; st++; tries = 0; later(step, 700);
    } else { tries++; b.classList.add('bad'); b.disabled = true; toast('Не подходит по смыслу. Попробуй другую реплику.'); }
  });
  const onKey = e => { const n = +e.key; if(n >= 1 && n <= 4){ const b = $$('.opt', rep)[n - 1]; if(b && !b.disabled) b.click(); } };
  document.addEventListener('keydown', onKey);
  cleanup = () => document.removeEventListener('keydown', onKey);
  function finish(){ result(g, ui, {score: first, total, stars: starsFor(first, total), earned: first * 10, line: `С первой попытки: ${first} из ${total}`}); }
  tries = 0; scene();
};

VIEWS.shop = () => {
  app.innerHTML = `<div class="game">
    <div class="ghead"><button class="btn ghost" data-go="home">← Все игры</button><div class="gmeta"><span class="tag t-p">小卖部</span><h2>Лавка наград</h2></div></div>
    <div class="chat" style="min-height:0;margin-top:16px"><div class="msg"><span class="who han">师傅</span><p class="han" id="say">先生，您要什么？</p><p class="ru" id="sayru">Что желаете? У вас в кошельке ${yuan(state.wallet)}.</p></div></div>
    <div class="shop-grid">${SHOP.map(s => `<div class="item">
      <span class="e" aria-hidden="true">${s.e}</span><span class="zh">${s.zh}</span><span class="ru">${s.ru}</span>
      <span class="tag"><b>${yuan(s.fen)}</b><small>${priceZh(s.fen)}</small></span>
      <button class="btn ${state.wallet >= s.fen ? 'primary' : ''}" data-buy="${s.id}" ${state.wallet >= s.fen ? '' : 'disabled'}>${state.wallet >= s.fen ? 'Купить' : 'Не хватает ' + yuan(s.fen - state.wallet)}</button>
    </div>`).join('')}</div>
    <h3 class="subh">Мои покупки</h3>
    <div class="shelf" id="shelf"></div>
    <div class="row" style="margin-top:28px"><button class="btn" id="reset">Сбросить прогресс</button><span class="muted" id="resetq"></span></div>
  </div>`;
  const drawShelf = () => {
    const own = SHOP.filter(s => state.shelf[s.id]);
    $('#shelf').innerHTML = own.length ? own.map(s => `<span title="${s.zh}">${s.e}</span><small>×${state.shelf[s.id]}</small>`).join('') : '<small>Пока пусто. Заработай 毛 в играх и возвращайся.</small>';
  };
  drawShelf();
  app.onclick = e => {
    const b = e.target.closest('[data-buy]');
    if(b){
      const s = SHOP.find(x => x.id === b.dataset.buy);
      if(state.wallet < s.fen) return;
      state.wallet -= s.fen; state.shelf[s.id] = (state.shelf[s.id] || 0) + 1; save(); updateWallet(true);
      VIEWS.shop();
      $('#say').textContent = `好！${s.zh}，${priceZh(s.fen)}钱。给您！您还要什么？`;
      $('#sayru').textContent = `Хорошо! ${s.ru}, ${yuan(s.fen)}. Пожалуйста! Что-нибудь ещё?`;
      return;
    }
    if(e.target.closest('#reset')){
      $('#resetq').innerHTML = 'Удалить кошелёк, звёзды и выученные слова? <button class="btn" id="resetyes">Да, сбросить</button>';
      return;
    }
    if(e.target.closest('#resetyes')){
      state.wallet = 0; state.best = {}; state.known = {}; state.shelf = {}; state.done = {}; save(); updateWallet(); toast('Прогресс сброшен'); go('home');
    }
  };
  cleanup = () => { app.onclick = null; };
};

/* ---------- boot ---------- */
function boot(d){
  updateWallet();
  const h = (location.hash || '').slice(1);
  go((d && d.view && VIEWS[d.view]) ? d.view : (VIEWS[h] ? h : 'home'));
}
try{ window.claude?.hot?.snapshot?.(() => ({view: current})); }catch(e){}
try{
  if(window.claude?.hot?.ready) window.claude.hot.ready(boot);
  else boot(window.claude?.hot?.data ?? {});
}catch(e){ boot({}); }
})();
</script>
